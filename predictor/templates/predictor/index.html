<!DOCTYPE html>
<html>
<head>
    <title>Iris Classifier</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .container{
            width:700px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:#333;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkgreen;
        }

        .result{
            margin-top:20px;
            padding:15px;
            background:#d4edda;
            border-radius:5px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        table, th, td{
            border:1px solid #ccc;
        }

        th{
            background:#4CAF50;
            color:white;
            padding:10px;
        }

        td{
            padding:10px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        .dataset-title{
            margin-top:40px;
            text-align:center;
            color:#333;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Iris Flower Prediction</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}

        <div class="result">

            <h2>Prediction:</h2>

            <h3>{{ prediction|title }}</h3>

        </div>

    {% endif %}

    <h2 class="dataset-title">Sample Iris Dataset</h2>

    <table>

        <tr>
            <th>Sepal Length</th>
            <th>Sepal Width</th>
            <th>Petal Length</th>
            <th>Petal Width</th>
            <th>Flower</th>
        </tr>

        <tr>
            <td>5.1</td>
            <td>3.5</td>
            <td>1.4</td>
            <td>0.2</td>
            <td>Setosa</td>
        </tr>

        <tr>
            <td>6.0</td>
            <td>2.9</td>
            <td>4.5</td>
            <td>1.5</td>
            <td>Versicolor</td>
        </tr>

        <tr>
            <td>6.5</td>
            <td>3.0</td>
            <td>5.5</td>
            <td>2.0</td>
            <td>Virginica</td>
        </tr>

    </table>

</div>

</body>
</html>
